<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقديم طلب انضمام</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>تقديم طلب جديد</h2>
    <form id="applyForm">
        <div class="input-group">
            <label>الاسم الكامل</label>
            <input type="text" id="name" placeholder="ادخل اسمك الثلاثي" required>
        </div>

        <div class="input-group">
            <label>العمر</label>
            <input type="number" id="age" placeholder="مثال: 20" required>
        </div>

        <div class="input-group">
            <label>الايدي (ID)</label>
            <input type="text" id="discord_id" placeholder="ID الخاص بك" required>
        </div>

        <div class="input-group">
            <label>لماذا تريد الانضمام؟</label>
            <textarea id="reason" rows="4" placeholder="اكتب سبب تقديمك هنا..." required></textarea>
        </div>

        <button type="submit" id="submitBtn">إرسال الطلب</button>
        <p id="status"></p>
    </form>
</div>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1465701117727084595/-PGzo4uuVu_p1yZhPRSY-kSNJp8d3EUjaKu23EmvF6zdfi_OrhH4STYj9tFMZDzft_sT";

    document.getElementById('applyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        btn.innerText = "جاري الإرسال...";

        const payload = {
            embeds: [{
                title: "📌 طلب انضمام جديد",
                color: 65280,
                fields: [
                    { name: "👤 الاسم:", value: document.getElementById('name').value, inline: true },
                    { name: "🎂 العمر:", value: document.getElementById('age').value, inline: true },
                    { name: "🆔 الآيدي:", value: document.getElementById('discord_id').value },
                    { name: "📝 السبب:", value: document.getElementById('reason').value }
                ],
                footer: { text: "تاريخ الطلب: " + new Date().toLocaleString('ar-EG') }
            }]
        };

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                status.style.color = "#4ade80";
                status.innerText = "✅ تم إرسال طلبك بنجاح!";
                document.getElementById('applyForm').reset();
            } else {
                throw new Error();
            }
        } catch (error) {
            status.style.color = "#f87171";
            status.innerText = "❌ حدث خطأ، حاول مرة أخرى.";
        } finally {
            btn.disabled = false;
            btn.innerText = "إرسال الطلب";
        }
    });
</script>

</body>
</html>

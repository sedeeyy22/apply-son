<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التقديم الذكية</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #22d3ee;
            --bg: #0f172a;
            --danger: #ef4444;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent), 
                              radial-gradient(circle at bottom left, rgba(34, 211, 238, 0.1), transparent);
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; text-align: center; }
        p.subtitle { color: #94a3b8; margin-bottom: 40px; text-align: center; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 20px;
            border-radius: 24px;
            text-align: center;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(12px);
        }

        .card:hover:not(.locked) {
            background: rgba(99, 102, 241, 0.1);
            transform: scale(1.05);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card.locked {
            opacity: 0.5;
            cursor: not-allowed;
            border-style: dashed;
        }

        .card h3 { margin: 15px 0 0 0; font-size: 20px; }

        #formSection {
            display: none;
            width: 100%;
            max-width: 550px;
            background: rgba(30, 41, 59, 0.7);
            padding: 40px;
            border-radius: 32px;
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .back-btn {
            background: rgba(255,255,255,0.05); border: 1px solid #475569; color: #fff;
            padding: 10px 20px; border-radius: 12px; cursor: pointer; margin-bottom: 25px; transition: 0.3s;
        }

        .input-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 10px; color: #e2e8f0; font-weight: bold; }
        input, textarea, select {
            width: 100%; padding: 14px; background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: white; box-sizing: border-box;
            font-family: 'Tajawal';
        }

        .submit-btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none; border-radius: 14px; color: white; font-size: 18px; font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        .submit-btn:hover { filter: brightness(1.2); transform: translateY(-2px); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>بوابة التقديم الإلكترونية</h1>
    <p class="subtitle">اختر القطاع المناسب لبدء إجراءات الانضمام</p>

    <div class="grid-container" id="mainGrid">
        <div class="card" onclick="openForm('الجيش')">🎖️ <h3>الجيش</h3></div>
        <div class="card" onclick="openForm('الشرطة')">👮 <h3>الشرطة</h3></div>
        <div class="card" onclick="openForm('الصحة')">🚑 <h3>الصحة</h3></div>
        <div class="card" onclick="openForm('العدل')">⚖️ <h3>العدل</h3></div>
        <div class="card" onclick="openForm('مقفل التقديم')">🕵️ <h3>مقفل التقديم</h3></div>
        <div class="card" onclick="openForm('فتح عصابة')">🥷🏻 <h3>فتح عصابة</h3></div>
        <div class="card" onclick="openForm('الأجرام')">🔪 <h3>الأجرام</h3></div>
        <div class="card" onclick="openForm('مقفل التقديم')">🛠️ <h3>الإدارة</h3></div>
        <div class="card" onclick="openForm('مقفل التقديم')">👁️ <h3>مقفل التقديم</h3></div>
    </div>

    <div id="formSection">
        <button class="back-btn" onclick="closeForm()">← العودة للقطاعات</button>
        <h2 id="deptTitle" style="color: var(--accent); margin-top: 0;"></h2>
        
        <form id="applyForm">
            <input type="hidden" id="selectedDept">
            
            <div class="input-group">
                <label>يوزرك في الديسكورد</label>
                <input type="text" id="discord_user" placeholder="مثال: user_name" required>
            </div>

            <div class="input-group">
                <label id="nameLabel">اسمك رول</label>
                <input type="text" id="fullName" placeholder="" required>
            </div>

            <div class="input-group" id="ageGroup">
                <label>عمرك رول</label>
                <input type="number" id="ageRole" placeholder="مثال: 25">
            </div>

            <div class="input-group hidden" id="membersCountGroup">
                <label>كم عدد أعضاءك الذين معك؟</label>
                <input type="number" id="membersCount" placeholder="مثال: 5">
            </div>

            <div class="input-group">
                <label id="experienceLabel">خبراتك</label>
                <textarea id="experience" rows="4" required></textarea>
            </div>

            <div class="input-group hidden" id="roomAddGroup">
                <label>هل أنت حاب تضيف روم تقديم لعصابتك؟</label>
                <select id="addRoom">
                    <option value="نعم">نعم</option>
                    <option value="لا">لا</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">إرسال الطلب الآن</button>
        </form>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1465701117727084595/-PGzo4uuVu_p1yZhPRSY-kSNJp8d3EUjaKu23EmvF6zdfi_OrhH4STYj9tFMZDzft_sT";

        // وظيفة لإغلاق البطاقات التي تحتوي على كلمة "مقفل"
        function lockStatus() {
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (card.innerText.includes("مقفل")) {
                    card.classList.add('locked');
                }
            });
        }
        lockStatus();

        function openForm(dept) {
            if (dept.includes("مقفل")) {
                alert("نعتذر، التقديم على هذا القطاع مقفل حالياً.");
                return;
            }

            document.getElementById('mainGrid').classList.add('hidden');
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('deptTitle').innerText = "التقديم على: " + dept;
            document.getElementById('selectedDept').value = dept;

            // إعادة ضبط الحقول الافتراضية
            document.getElementById('membersCountGroup').classList.add('hidden');
            document.getElementById('roomAddGroup').classList.add('hidden');
            document.getElementById('ageGroup').classList.remove('hidden');
            
            // تخصيص الأسئلة بناءً على القسم
            if (dept === 'فتح عصابة') {
                document.getElementById('nameLabel').innerText = "اسمك رول:";
                document.getElementById('experienceLabel').innerText = "خبراتك الإجرامية (اكثر من سطرين):";
                document.getElementById('experience').placeholder = "اذكر تفاصيل خبراتك هنا...";
                document.getElementById('membersCountGroup').classList.remove('hidden');
                document.getElementById('roomAddGroup').classList.remove('hidden');
            } else if (dept === 'الإدارة') {
                document.getElementById('nameLabel').innerText = "الاسم الثلاثي:";
                document.getElementById('experienceLabel').innerText = "لماذا تريد الانضمام للإدارة؟";
            } else {
                document.getElementById('nameLabel').innerText = "اسمك رول (داخل اللعبة):";
                document.getElementById('experienceLabel').innerText = `خبراتك في قطاع ${dept}:`;
            }
            
            window.scrollTo(0, 0);
        }

        function closeForm() {
            document.getElementById('mainGrid').classList.remove('hidden');
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('applyForm').reset();
        }

        document.getElementById('applyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const dept = document.getElementById('selectedDept').value;
            btn.innerText = "جاري الإرسال...";
            btn.disabled = true;

            // تجهيز البيانات للديسكورد
            let fields = [
                { name: "🚩 القطاع:", value: `**${dept}**`, inline: false },
                { name: "🆔 ديسكورد:", value: document.getElementById('discord_user').value, inline: true },
                { name: "👤 اسم الرول:", value: document.getElementById('fullName').value, inline: true },
                { name: "🎂 عمر الرول:", value: document.getElementById('ageRole').value || "غير محدد", inline: true }
            ];

            if (dept === 'فتح عصابة') {
                fields.push({ name: "👥 عدد الأعضاء:", value: document.getElementById('membersCount').value, inline: true });
                fields.push({ name: "🏠 إضافة روم تقديم؟:", value: document.getElementById('addRoom').value, inline: true });
            }

            fields.push({ name: "📑 تفاصيل الخبرة:", value: document.getElementById('experience').value });

            const payload = {
                username: "بوابة التقديم",
                embeds: [{
                    title: "📨 طلب تقديم جديد",
                    color: dept === 'فتح عصابة' ? 15158332 : 3447003,
                    fields: fields,
                    footer: { text: "توقيت الطلب: " + new Date().toLocaleString('ar-SA') }
                }]
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if(response.ok) {
                    alert("✅ تم إرسال طلبك بنجاح!");
                    closeForm();
                } else { throw new Error(); }
            } catch (error) {
                alert("❌ حدث خطأ في الإرسال، تأكد من اتصالك.");
            } finally {
                btn.innerText = "إرسال الطلب الآن";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

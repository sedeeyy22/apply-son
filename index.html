<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التقديم الذكية</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #22d3ee;
            --bg: #0f172a;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent), 
                              radial-gradient(circle at bottom left, rgba(34, 211, 238, 0.1), transparent);
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; text-align: center; }
        p.subtitle { color: #94a3b8; margin-bottom: 40px; text-align: center; }

        /* شبكة المربعات */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 20px;
            border-radius: 24px;
            text-align: center;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(12px);
        }

        .card:hover {
            background: rgba(99, 102, 241, 0.1);
            transform: scale(1.05);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card h3 { margin: 15px 0 0 0; font-size: 20px; }

        /* قسم النموذج */
        #formSection {
            display: none;
            width: 100%;
            max-width: 550px;
            background: rgba(30, 41, 59, 0.7);
            padding: 40px;
            border-radius: 32px;
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .back-btn {
            background: rgba(255,255,255,0.05); border: 1px solid #475569; color: #fff;
            padding: 10px 20px; border-radius: 12px; cursor: pointer; margin-bottom: 25px; transition: 0.3s;
        }
        .back-btn:hover { background: #475569; }

        .input-group { margin-bottom: 22px; }
        label { display: block; margin-bottom: 10px; color: #e2e8f0; font-weight: bold; }
        input, textarea {
            width: 100%; padding: 14px; background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: white; box-sizing: border-box;
            font-family: 'Tajawal';
        }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; }

        .submit-btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none; border-radius: 14px; color: white; font-size: 18px; font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        .submit-btn:hover { filter: brightness(1.2); transform: translateY(-2px); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>بوابة التقديم الإلكترونية</h1>
    <p class="subtitle">اختر القطاع المناسب لبدء إجراءات الانضمام</p>

    <!-- قائمة المربعات -->
    <div class="grid-container" id="mainGrid">
        <div class="card" onclick="openForm('الجيش')">🎖️ <h3>الجيش</h3></div>
        <div class="card" onclick="openForm('الشرطة')">👮 <h3>الشرطة</h3></div>
        <div class="card" onclick="openForm('الصحة')">🚑 <h3>الصحة</h3></div>
        <div class="card" onclick="openForm('العدل')">⚖️ <h3>العدل</h3></div>
        <div class="card" onclick="openForm('مقفل التقديم')">🕵️ <h3>مقفل التقديم</h3></div>
        <div class="card" onclick="openForm('فتح عصابة')">🥷🏻 <h3>فتح عصابة</h3></div>
        <div class="card" onclick="openForm('الأجرام')">🔪 <h3>الأجرام</h3></div>
        <div class="card" onclick="openForm('مقفل التقديم')">🛠️ <h3>الإدارة</h3></div>
        <div class="card" onclick="openForm('مقفل التقديم')">👁️ <h3>مقفل التقديم</h3></div>
    </div>

    <!-- قسم التقديم -->
    <div id="formSection">
        <button class="back-btn" onclick="closeForm()">← العودة للقطاعات</button>
        <h2 id="deptTitle" style="color: var(--accent); margin-top: 0;">التقديم على القسم</h2>
        
        <form id="applyForm">
            <input type="hidden" id="selectedDept">
            
            <div class="input-group">
                <label>يوزرك في الديسكورد</label>
                <input type="text" id="discord_user" placeholder="مثال: user_name" required>
            </div>

            <div class="input-group">
                <label id="nameLabel">الاسم</label>
                <input type="text" id="fullName" placeholder="اكتب اسمك هنا" required>
            </div>

            <!-- السؤال المتغير عن الخبرات -->
            <div class="input-group">
                <label id="experienceLabel">خبراتك في هذا القطاع</label>
                <textarea id="experience" rows="4" placeholder="اذكر خبراتك السابقة بالتفصيل..." required></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">إرسال الطلب الآن</button>
        </form>
    </div>

    <script>
        // اضع رابط الويب هوك الخاص بك هنا
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1465701117727084595/-PGzo4uuVu_p1yZhPRSY-kSNJp8d3EUjaKu23EmvF6zdfi_OrhH4STYj9tFMZDzft_sT";

        function openForm(dept) {
            document.getElementById('mainGrid').classList.add('hidden');
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('deptTitle').innerText = "التقديم على قطاع: " + dept;
            document.getElementById('selectedDept').value = dept;

            // تحديث سؤال الخبرات بناءً على القسم
            document.getElementById('experienceLabel').innerText = `ما هي خبراتك في (${dept})؟`;

            // تحديث مسمى الاسم بناءً على طلبك
            const nameLabel = document.getElementById('nameLabel');
            if (dept === 'إدارة' || dept === 'رقابة') {
                nameLabel.innerText = "الاسم الثلاثي";
            } else {
                nameLabel.innerText = "اسمك رول (داخل اللعبة)";
            }
            window.scrollTo(0, 0);
        }

        function closeForm() {
            document.getElementById('mainGrid').classList.remove('hidden');
            document.getElementById('formSection').style.display = 'none';
        }

        document.getElementById('applyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "جاري الإرسال الرقمي...";
            btn.disabled = true;

            const payload = {
                username: "بوت التقديم",
                embeds: [{
                    title: "📨 طلب انضمام جديد",
                    color: 5814783,
                    fields: [
                        { name: "🚩 القطاع المطلوب:", value: `**${document.getElementById('selectedDept').value}**`, inline: false },
                        { name: "🆔 ديسكورد:", value: document.getElementById('discord_user').value, inline: true },
                        { name: "👤 الاسم المرفق:", value: document.getElementById('fullName').value, inline: true },
                        { name: `📑 الخبرات في ${document.getElementById('selectedDept').value}:`, value: document.getElementById('experience').value }
                    ],
                    footer: { text: "ساعة التقديم: " + new Date().toLocaleString('ar-EG') }
                }]
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if(response.ok) {
                    alert("✅ تم استلام طلبك بنجاح، سيتم الرد عليك قريباً.");
                    document.getElementById('applyForm').reset();
                    closeForm();
                } else {
                    throw new Error();
                }
            } catch (error) {
                alert("❌ فشل الإرسال! تأكد من إعدادات الويب هوك.");
            } finally {
                btn.innerText = "إرسال الطلب الآن";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

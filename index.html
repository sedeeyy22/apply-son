<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التقديم المتطورة</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #22d3ee;
            --bg: #0f172a;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.2), transparent), 
                              radial-gradient(circle at bottom left, rgba(34, 211, 238, 0.1), transparent);
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 0 0 20px rgba(99, 102, 241, 0.5); }
        p.subtitle { color: #94a3b8; margin-bottom: 40px; }

        /* شبكة المربعات */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            transition: 0.5s ease;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(34, 211, 238, 0.2);
        }

        .card i { font-size: 40px; display: block; margin-bottom: 15px; }

        /* النموذج (مخفي في البداية) */
        #formSection {
            display: none;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.07);
            padding: 40px;
            border-radius: 30px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .back-btn {
            background: none; border: 1px solid #475569; color: #94a3b8;
            padding: 8px 15px; border-radius: 10px; cursor: pointer; margin-bottom: 20px;
        }

        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 14px; }
        input, textarea {
            width: 100%; padding: 12px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; box-sizing: border-box;
        }

        .submit-btn {
            width: 100%; padding: 15px; background: linear-gradient(45deg, var(--primary), var(--accent));
            border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>بوابة التقديم</h1>
    <p class="subtitle">اختر القسم الذي تود الانضمام إليه</p>

    <!-- قائمة المربعات -->
    <div class="grid-container" id="mainGrid">
        <div class="card" onclick="openForm('الجيش')">🎖️ <h3>الجيش</h3></div>
        <div class="card" onclick="openForm('الشرطة')">👮 <h3>الشرطة</h3></div>
        <div class="card" onclick="openForm('الصحة')">🚑 <h3>الصحة</h3></div>
        <div class="card" onclick="openForm('العدل')">⚖️ <h3>العدل</h3></div>
        <div class="card" onclick="openForm('الأستخبارات')">🕵️ <h3>الأستخبارات</h3></div>
        <div class="card" onclick="openForm('المافيا الروسية')">🐻 <h3>المافيا</h3></div>
        <div class="card" onclick="openForm('الأجرام')">🔪 <h3>الأجرام</h3></div>
        <div class="card" onclick="openForm('إدارة')">🛠️ <h3>إدارة</h3></div>
        <div class="card" onclick="openForm('رقابة')">👁️ <h3>رقابة</h3></div>
    </div>

    <!-- قسم التقديم -->
    <div id="formSection">
        <button class="back-btn" onclick="closeForm()">← العودة للقائمة</button>
        <h2 id="deptTitle">التقديم على القسم</h2>
        
        <form id="applyForm">
            <input type="hidden" id="selectedDept">
            
            <div class="input-group">
                <label>يوزرك في الديسكورد</label>
                <input type="text" id="discord_user" placeholder="Discord User" required>
            </div>

            <div class="input-group">
                <label id="nameLabel">اسمك رول</label>
                <input type="text" id="fullName" required>
            </div>

            <div class="input-group">
                <label>لماذا تريد التقديم؟</label>
                <textarea id="reason" rows="4" required></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">إرسال الطلب</button>
        </form>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1465701117727084595/-PGzo4uuVu_p1yZhPRSY-kSNJp8d3EUjaKu23EmvF6zdfi_OrhH4STYj9tFMZDzft_sT";

        function openForm(dept) {
            document.getElementById('mainGrid').classList.add('hidden');
            document.getElementById('formSection').style.display = 'block';
            document.getElementById('deptTitle').innerText = "التقديم على: " + dept;
            document.getElementById('selectedDept').value = dept;

            // تغيير المسمى بناءً على القسم
            const nameLabel = document.getElementById('nameLabel');
            if (dept === 'إدارة' || dept === 'رقابة') {
                nameLabel.innerText = "الاسم الثلاثي";
            } else {
                nameLabel.innerText = "اسمك رول (Roleplay)";
            }
        }

        function closeForm() {
            document.getElementById('mainGrid').classList.remove('hidden');
            document.getElementById('formSection').style.display = 'none';
        }

        document.getElementById('applyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "جاري الإرسال...";
            btn.disabled = true;

            const payload = {
                embeds: [{
                    title: "📬 طلب انضمام جديد",
                    color: 3447003,
                    fields: [
                        { name: "🏢 القسم:", value: document.getElementById('selectedDept').value, inline: true },
                        { name: "🆔 ديسكورد:", value: document.getElementById('discord_user').value, inline: true },
                        { name: "👤 الاسم:", value: document.getElementById('fullName').value },
                        { name: "💬 السبب:", value: document.getElementById('reason').value }
                    ],
                    footer: { text: "تاريخ الطلب: " + new Date().toLocaleString() }
                }]
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert("✅ تم إرسال طلبك بنجاح!");
                closeForm();
            } catch (error) {
                alert("❌ فشل الإرسال، تحقق من الويب هوك.");
            } finally {
                btn.innerText = "إرسال الطلب";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
